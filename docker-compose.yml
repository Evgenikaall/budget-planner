version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: budget-planner-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: budget_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:

